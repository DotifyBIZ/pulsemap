name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # Pulsemap.App is a WinUI3/Windows App SDK project — the solution can only build on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked mode — fails if packages.lock.json is out of sync)
        run: dotnet restore Pulsemap.sln --locked-mode

      - name: Verify formatting
        run: dotnet format Pulsemap.sln --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build Pulsemap.sln --configuration Release --no-restore

      # CLAUDE.md mandates 80% branch coverage on Pulsemap.App.Core specifically - UI projects are
      # exempt - so coverage/threshold enforcement is scoped to just this project's test run
      # rather than applied blanket across the solution.
      - name: Test Pulsemap.App.Core (Release, 80% branch coverage gate)
        run: >
          dotnet test tests/Pulsemap.App.Core.Tests/Pulsemap.App.Core.Tests.csproj
          --configuration Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../TestResults/
          -p:Threshold=80 -p:ThresholdType=branch -p:ThresholdStat=total

      - name: Test Pulsemap.App (Release)
        run: dotnet test tests/Pulsemap.App.Tests/Pulsemap.App.Tests.csproj --configuration Release --no-build

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/
          retention-days: 14
