name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # Pulsemap.App is a WinUI3/Windows App SDK project — the solution can only build on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked mode — fails if packages.lock.json is out of sync)
        run: dotnet restore Pulsemap.sln --locked-mode

      - name: Verify formatting
        run: dotnet format Pulsemap.sln --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build Pulsemap.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test Pulsemap.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: ./TestResults
          retention-days: 14
